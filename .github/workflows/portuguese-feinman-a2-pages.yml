name: Portuguese by Feinman A2 - GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "portuguese-feinman-a2/**"
      - ".github/workflows/portuguese-feinman-a2-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portuguese-feinman-a2
      - id: deployment
        uses: actions/deploy-pages@v4
