<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portuguese by Feinman A2</title>
<meta name="description" content="Português Europeu — курс A2 за 12 недель: MQP, Conjuntivo, Passiva, CIPLE. Метод Фейнмана.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#f0ede5; --border:#e2ddd1;
  --text:#1f2328; --muted:#626a73; --accent:#0a6b4f; --accent-2:#c8102e;
  --accent-soft:#e3f1ec; --warn-soft:#fdf1dc; --warn:#8a5a00;
  --ok:#0a7a3e; --bad:#b3261e; --ok-soft:#e5f4ea; --bad-soft:#fbe9e7;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --surface:#1d2126; --surface-2:#252a30; --border:#333a42;
    --text:#e8e6e1; --muted:#9aa3ad; --accent:#4fc39a; --accent-2:#ff6b7d;
    --accent-soft:#1c3129; --warn-soft:#33291a; --warn:#f0bf6a;
    --ok:#5fd18f; --bad:#ff8a80; --ok-soft:#1b3024; --bad-soft:#3a1f1d;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --surface:#1d2126; --surface-2:#252a30; --border:#333a42;
  --text:#e8e6e1; --muted:#9aa3ad; --accent:#4fc39a; --accent-2:#ff6b7d;
  --accent-soft:#1c3129; --warn-soft:#33291a; --warn:#f0bf6a;
  --ok:#5fd18f; --bad:#ff8a80; --ok-soft:#1b3024; --bad-soft:#3a1f1d;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 64px}
header h1{font-family:Lora,Georgia,serif;font-size:clamp(22px,4vw,32px);margin:0 0 4px;line-height:1.2}
header .sub{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.theme-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px;flex:none}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:16px 0 8px;scrollbar-width:thin}
.weeks button{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.weeks button.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .weeks button.on{color:#0d1411}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .weeks button.on{color:#0d1411}}
.weeks button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin:8px 0 20px}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 12px;font:inherit;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent-2);font-weight:600}
.week-title{font-family:Lora,Georgia,serif;font-size:22px;margin:0 0 4px}
.week-tag{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.goal h3{margin:0 0 6px;font-size:17px}
.goal p{margin:0}
.day{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--border)}
.label + .day{border-top:0}
.day .d{font-weight:700;color:var(--accent);font-size:13px;padding-top:2px}
.day h4{margin:0 0 6px;font-size:15px}
.day ul{margin:0;padding:0;list-style:none}
.day li{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.day li input{margin-top:4px;accent-color:var(--accent);flex:none}
.day li.done span{color:var(--muted);text-decoration:line-through}
.prog-row{display:grid;grid-template-columns:minmax(120px,200px) 1fr 48px;gap:12px;align-items:center;padding:6px 0}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.prog-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.content h3{font-size:17px;margin:22px 0 8px}
.content h3:first-child{margin-top:0}
.content p{margin:0 0 10px}
.content ul{padding-left:20px;margin:0 0 10px}
.ex{display:flex;flex-direction:column;border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}
.ex b{font-weight:600}
.ex span{color:var(--muted);font-size:13.5px}
.note{background:var(--warn-soft);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.note strong{color:var(--warn)}
.tbl-wrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:600;font-size:13px}
td em{color:var(--accent-2);font-style:normal;font-weight:600}
.timeline{display:flex;align-items:center;gap:0;margin:14px 0 6px;overflow-x:auto;padding-bottom:4px}
.timeline .pt{flex:1;min-width:110px;text-align:center;position:relative;padding-top:22px;font-size:13px}
.timeline .pt::before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--border)}
.timeline .pt::after{content:"";position:absolute;top:3px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent)}
.timeline .pt.hl::after{background:var(--accent-2)}
.timeline .pt b{display:block}
.timeline .pt span{color:var(--muted)}
.dlg{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;align-items:flex-start}
.line.r{flex-direction:row-reverse}
.who{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.line.r .who{background:var(--accent-2)}
.bub{background:var(--surface-2);border-radius:12px;padding:8px 12px;max-width:78%}
.bub .pt{font-weight:500}
.bub .ru{color:var(--muted);font-size:13px;display:none}
.show-ru .bub .ru{display:block}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1411}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1411}}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.q{padding:14px 0;border-top:1px solid var(--border)}
.q:first-child{border-top:0;padding-top:0}
.q p{margin:0 0 8px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:6px}
.opts label{display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer}
.opts input{accent-color:var(--accent)}
.opts label.right{border-color:var(--ok);background:var(--ok-soft)}
.opts label.wrong{border-color:var(--bad);background:var(--bad-soft)}
.exp{font-size:13.5px;color:var(--muted);margin-top:6px;display:none}
.checked .exp{display:block}
.score{font-size:18px;font-weight:700;margin-top:12px}
textarea{width:100%;min-height:140px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:10px;font:inherit;resize:vertical}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
footer{color:var(--muted);font-size:12px;margin-top:32px;text-align:center}
@media (max-width:560px){
  .card{padding:14px}
  .day{grid-template-columns:1fr;gap:4px}
  .prog-row{grid-template-columns:1fr 44px}
  .prog-row .bar{grid-column:1/-1;grid-row:2}
  .bub{max-width:86%}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1>🇵🇹 Português Europeu — Курс A2</h1>
        <div class="sub">12 недель · MQP · Conjuntivo · Passiva · CIPLE · Метод Фейнмана</div>
      </div>
      <button class="theme-btn" id="themeBtn" aria-label="Сменить тему">◐ Тема</button>
    </div>
  </header>
  <nav class="weeks" id="weeks" aria-label="Недели"></nav>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  <main id="main"></main>
  <footer>Portuguese by Feinman A2 · прогресс хранится только в этом браузере</footer>
</div>

<script>
/* ---------- helpers ---------- */
const ex = (pt, ru) => `<div class="ex"><b>${pt}</b><span>${ru}</span></div>`;
const note = (t) => `<div class="note">${t}</div>`;
const tbl = (head, rows) => `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const tl = (pts) => `<div class="timeline">${pts.map(p=>`<div class="pt${p[2]?' hl':''}"><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div>`;
const ul = (items) => `<ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;

const store = {
  get(k, d){ try{ const v = localStorage.getItem('pfa2:'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('pfa2:'+k, JSON.stringify(v)); }catch(e){} }
};

const TABS = [
  ['plan','📅 План'],['theory','📖 Теория'],['forms','⚙️ Формы'],['usage','💡 Употребление'],
  ['compare','⚖️ Сравнение'],['dialog','💬 Диалог'],['test','🎯 Тест'],['feynman','✍️ Фейнман']
];
const DAYS = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];

/* ---------- course data ---------- */
const W = [];

/* ===== WEEK 1 — MQP ===== */
W.push({
  title:'Pretérito Mais-que-Perfeito (MQP)',
  tag:'Прошедшее в прошедшем · tinha + particípio',
  goal:'Описывать цепочку событий в прошлом: что произошло до другого прошедшего действия. Использовать Pretérito Mais-que-Perfeito (MQP) в письменной и разговорной речи EP. Различать MQP, Perfeito и Imperfeito в нарративе.',
  days:[
    ['Теория — что такое плюсквамперфект',['Прочитать раздел «Теория» — понять логику MQP на временной шкале','Аналогия Фейнмана: сравнить с русским «я уже сделал это до того»','Выписать 5 ситуаций из своей жизни, где нужен MQP']],
    ['Формы — правильные и неправильные глаголы',['Образование MQP: tinha/tínhamos + particípio passado','Причастия: -ado/-ido + неправильные (feito, dito, posto, visto…)','Проспрягать 10 глаголов во всех лицах MQP']],
    ['Употребление — когда использовать MQP',['MQP vs Perfeito vs Imperfeito — три роли в нарративе','Маркеры: já, ainda não, quando, antes de, depois de','Написать рассказ (8 предложений) с тремя временами']],
    ['MQP composto vs MQP simples',['Составная форма (ter+particípio) — разговорная EP','Простая форма (falara, comera) — литературная/формальная','Читать текст с MQP simples, переводить в MQP composto']],
    ['Диалог и аудирование',['Разыграть диалог «O que tinha acontecido?» — обе роли','Слушать RTP: найти примеры MQP в новостных текстах','Записать 3 найденных примера и объяснить их функцию']],
    ['Тест + закрепление',['Пройти тест недели (раздел 🎯) — цель 80%+','Написать рассказ о событии: что случилось и что было до него','Прочитать отрывок из португальской прозы — найти MQP']],
    ['Фейнман-урок недели',['Запись 2–3 мин: объяснить MQP «как ребёнку»','Нарисовать временну́ю шкалу: MQP → Perfeito/Imperfeito → Presente','Список пробелов → план недели 2 (Conjuntivo)']]
  ],
  progress:['Теория MQP','Формы и причастия','Употребление','Нарратив (3 времени)'],
  theory:`
    <h3>Идея в одной фразе</h3>
    <p>MQP — это <strong>«прошедшее до прошедшего»</strong>. Когда вы рассказываете о прошлом и хотите показать, что одно действие случилось <em>ещё раньше</em> другого, вы берёте MQP.</p>
    ${tl([['MQP','tinha saído',1],['Perfeito','cheguei'],['Agora','presente']])}
    ${ex('Quando cheguei à estação, o comboio já tinha partido.','Когда я пришёл на вокзал, поезд уже ушёл (ушёл раньше, чем я пришёл).')}
    <h3>Аналогия Фейнмана</h3>
    <p>Представьте рассказ как фильм. Perfeito — это кадры, которые идут один за другим. MQP — это <strong>флешбэк</strong>: камера на секунду отматывает назад, чтобы показать то, что уже случилось до текущей сцены.</p>
    <p>В русском нет отдельного времени — мы говорим «уже», «до этого», «к тому моменту». В португальском это грамматика: <em>tinha feito</em> = «к тому моменту уже сделал».</p>
    ${note('<strong>Правило-проверка:</strong> если в русском предложении можно вставить «к тому моменту уже…», а рассказ идёт в прошедшем — скорее всего нужен MQP.')}
    <h3>Две формы</h3>
    ${ul(['<b>MQP composto</b>: <i>tinha + particípio</i> — живая речь в Португалии. <i>Eu tinha comido.</i>','<b>MQP simples</b>: <i>comera, falara, fizera</i> — книги, пресса, официальный стиль. В разговоре почти не встречается, но на CIPLE нужно узнавать в текстах.'])}`,
  forms:`
    <h3>Вспомогательный глагол TER в Imperfeito</h3>
    ${tbl(['Лицо','ter (imperf.)','+ falar','+ comer','+ partir'],[
      ['eu','tinha','tinha falado','tinha comido','tinha partido'],
      ['tu','tinhas','tinhas falado','tinhas comido','tinhas partido'],
      ['ele / ela / você','tinha','tinha falado','tinha comido','tinha partido'],
      ['nós','<em>tínhamos</em>','tínhamos falado','tínhamos comido','tínhamos partido'],
      ['eles / elas / vocês','tinham','tinham falado','tinham comido','tinham partido']])}
    <h3>Particípio passado</h3>
    <p>Правильные: <b>-ar → -ado</b>, <b>-er/-ir → -ido</b>. Причастие после <i>ter</i> <strong>не меняется</strong> по роду и числу.</p>
    ${tbl(['Инфинитив','Particípio','Инфинитив','Particípio'],[
      ['fazer','<em>feito</em>','abrir','<em>aberto</em>'],
      ['dizer','<em>dito</em>','escrever','<em>escrito</em>'],
      ['pôr','<em>posto</em>','cobrir','<em>coberto</em>'],
      ['ver','<em>visto</em>','ganhar','<em>ganho</em>'],
      ['vir','<em>vindo</em>','gastar','<em>gasto</em>'],
      ['voltar','voltado','pagar','<em>pago</em>']])}
    <h3>MQP simples (литературная форма)</h3>
    <p>Берём 3 л. мн. ч. Perfeito, убираем <b>-ram</b>, добавляем <b>-ra, -ras, -ra, -ramos, -ram</b>:</p>
    ${tbl(['Perfeito (eles)','MQP simples (eu)','nós'],[
      ['falaram','falara','falá<em>ramos</em>'],['comeram','comera','comê<em>ramos</em>'],
      ['fizeram','fizera','fizé<em>ramos</em>'],['disseram','dissera','dissé<em>ramos</em>'],
      ['foram','fora','fô<em>ramos</em>'],['estiveram','estivera','estivé<em>ramos</em>']])}
    ${note('<strong>Внимание:</strong> в форме nós появляется ударение: <i>falávamos</i> (imperf.) ≠ <i>faláramos</i> (MQP simples).')}`,
  usage:`
    <h3>Три роли в нарративе</h3>
    ${tbl(['Время','Роль','Пример'],[
      ['Imperfeito','Декорации, фон, привычка','<i>Chovia e estava frio.</i>'],
      ['Perfeito','Главное событие сюжета','<i>O telefone tocou.</i>'],
      ['MQP','То, что случилось ещё раньше','<i>Eu já tinha adormecido.</i>']])}
    ${ex('Era meia-noite. O telefone tocou, mas eu já tinha adormecido.','Была полночь. Зазвонил телефон, но я уже уснул.')}
    <h3>Маркеры</h3>
    ${ul(['<b>já</b> — уже: <i>Ela já tinha jantado.</i>','<b>ainda não</b> — ещё не: <i>Ainda não tinham chegado.</i>','<b>quando</b> — когда: <i>Quando liguei, ele já tinha saído.</i>','<b>antes de / antes disso</b>: <i>Antes disso, tínhamos vivido no Porto.</i>','<b>nunca</b> — никогда (до того момента): <i>Nunca tinha visto o mar.</i>'])}
    <h3>Типичные ситуации</h3>
    ${ul(['Объяснение причины: <i>Estava cansado porque tinha trabalhado 12 horas.</i>','Первый опыт: <i>Foi a primeira vez que eu tinha comido bacalhau à Brás.</i>','Косвенная речь: <i>Ele disse que tinha perdido a chave.</i> (подробнее — неделя 10)'])}`,
  compare:`
    ${tbl(['','Perfeito','Imperfeito','MQP composto','MQP simples'],[
      ['Пример','fiz','fazia','tinha feito','fizera'],
      ['Вопрос','Что случилось?','Какая была обстановка?','Что было ещё раньше?','То же, книжно'],
      ['Стиль','нейтральный','нейтральный','разговорный + письменный','литературный'],
      ['Рус.','сделал','делал','уже сделал (к тому моменту)','уже сделал']])}
    <h3>Одно событие — три оптики</h3>
    ${ex('Saí de casa às 8h.','Я вышел из дома в 8 (факт).')}
    ${ex('Saía de casa às 8h todos os dias.','Я выходил из дома в 8 каждый день (привычка).')}
    ${ex('Quando a Ana ligou, eu já tinha saído de casa.','Когда Ана позвонила, я уже вышел из дома (раньше звонка).')}
    ${note('<strong>Частая ошибка русскоговорящих:</strong> ставить Perfeito везде, где по-русски «уже сделал». Спросите себя: есть ли в рассказе <em>другая</em> точка в прошлом, относительно которой это «уже»? Если да — MQP.')}`,
  dialog:[
    ['A','Rui, o que é que aconteceu ontem? Chegaste tão tarde!','Руи, что вчера случилось? Ты так поздно пришёл!'],
    ['R','Nem imaginas. Quando cheguei à estação, o comboio já tinha partido.','Даже не представляешь. Когда я пришёл на вокзал, поезд уже ушёл.'],
    ['A','Mas tu não tinhas comprado o bilhete com antecedência?','Но ты разве не купил билет заранее?'],
    ['R','Tinha, sim! Mas tinha-me esquecido de que mudaram o horário.','Купил! Но забыл, что поменяли расписание.'],

/* ---------- state ---------- */
let week = Math.min(Math.max(store.get('week', 0), 0), W.length - 1);
let tab = store.get('tab', 'plan');
if (!TABS.some(t => t[0] === tab)) tab = 'plan';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderWeeks(){
  $('#weeks').innerHTML = W.map((w,i)=>{
    const done = store.get('score:'+i, null);
    return `<button class="${i===week?'on':''}" data-w="${i}" title="${esc(w.title)}">Нед.${i+1}${done && done.pct>=80?'<span class="dot"></span>':''}</button>`;
  }).join('');
  const on = $('#weeks .on'); if (on && on.scrollIntoView) on.scrollIntoView({block:'nearest',inline:'center'});
}
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('');
}
function header(w){
  return `<h2 class="week-title">Неделя ${week+1}. ${w.title}</h2><div class="week-tag">${w.tag}</div>`;
}

function progressHTML(w){
  const sc = store.get('score:'+week, null);
  return `<div class="card"><div class="label">Прогресс</div>
    ${w.progress.map((p,i)=>{
      const v = sc && sc.cat && sc.cat[i] != null ? sc.cat[i] : null;
      return `<div class="prog-row"><div>${p}</div><div class="bar"><i style="width:${v==null?0:v}%"></i></div><div class="v">${v==null?'–':v+'%'}</div></div>`;
    }).join('')}
    <div class="hint">${sc ? `Последний тест: ${sc.pct}% (${sc.right}/${sc.total})` : 'Обновляется после теста (раздел 🎯)'}</div></div>`;
}

function renderPlan(w){
  const checks = store.get('plan:'+week, {});
  return `${header(w)}
  <div class="card goal"><div class="label">Цель недели</div><h3>Что вы умеете после недели ${week+1} A2</h3><p>${w.goal}</p></div>
  <div class="card"><div class="label">Программа по дням</div>
    ${w.days.map((d,di)=>`<div class="day"><div class="d">${DAYS[di]}</div><div><h4>${d[0]}</h4><ul>
      ${d[1].map((it,ii)=>{const id=di+'-'+ii;const on=!!checks[id];return `<li class="${on?'done':''}"><input type="checkbox" data-c="${id}" ${on?'checked':''} aria-label="${esc(it)}"><span>${it}</span></li>`;}).join('')}
    </ul></div></div>`).join('')}
  </div>
  ${progressHTML(w)}`;
}

function renderContent(w, key){
  return `${header(w)}<div class="card content">${w[key]}</div>`;
}

function renderDialog(w){
  const names = {};
  return `${header(w)}<div class="card">
    <div class="label">Диалог — разыграйте обе роли</div>
    <div class="dlg" id="dlg">${w.dialog.map(([who,pt,ru])=>{
      if(!(who in names)) names[who] = Object.keys(names).length;
      return `<div class="line${names[who]%2?' r':''}"><div class="who">${who}</div><div class="bub"><div class="pt">${pt}</div><div class="ru">${ru}</div></div></div>`;
    }).join('')}</div>
    <div class="btns"><button class="btn" id="toggleRu">Показать перевод</button>${'speechSynthesis' in window?'<button class="btn" id="speak">🔊 Озвучить (pt-PT)</button>':''}</div>
  </div>`;
}

function renderTest(w){
  const sc = store.get('score:'+week, null);
  return `${header(w)}<div class="card" id="test">
    <div class="label">Тест недели · цель 80%+</div>
    ${w.test.map((t,qi)=>`<div class="q" data-q="${qi}"><p>${qi+1}. ${t.q}</p><div class="opts">
      ${t.o.map((o,oi)=>`<label><input type="radio" name="q${qi}" value="${oi}"> ${o}</label>`).join('')}
    </div><div class="exp">${t.e}</div></div>`).join('')}
    <div class="btns"><button class="btn primary" id="check">Проверить</button><button class="btn" id="reset">Сбросить</button></div>
    <div class="score" id="score">${sc?`Лучший результат сохранён: ${sc.pct}%`:''}</div>
  </div>`;
}

function renderFeynman(w){
  const txt = store.get('feyn:'+week, '');
  return `${header(w)}
  <div class="card"><div class="label">Метод Фейнмана — 4 шага</div>
    <ol class="steps">
      <li><div><b>Выберите тему:</b> ${w.feynman.task}</div></li>
      <li><div><b>Объясните простыми словами</b> — письменно ниже или голосом (2–3 мин). Без терминов, с примером из жизни.</div></li>
      <li><div><b>Найдите пробелы:</b> где вы запнулись? Вернитесь к «Теории» и «Формам».</div></li>
      <li><div><b>Упростите и используйте аналогию.</b> Перепишите объяснение короче.</div></li>
    </ol>
  </div>
  <div class="card content"><div class="label">Вопросы для самопроверки</div>${ul(w.feynman.prompts)}</div>
  <div class="card"><div class="label">Моё объяснение</div>
    <textarea id="feyn" placeholder="Объясните тему так, будто рассказываете ребёнку…">${esc(txt)}</textarea>
    <div class="hint" id="feynHint">Сохраняется автоматически в этом браузере.</div>
  </div>`;
}

function render(){
  const w = W[week];
  renderWeeks(); renderTabs();
  let html;
  switch(tab){
    case 'plan': html = renderPlan(w); break;
    case 'dialog': html = renderDialog(w); break;
    case 'test': html = renderTest(w); break;
    case 'feynman': html = renderFeynman(w); break;
    default: html = renderContent(w, tab);
  }
  $('#main').innerHTML = html;
}

/* ---------- events ---------- */
document.addEventListener('click', (e)=>{
  const wb = e.target.closest('[data-w]');
  if (wb){ week = +wb.dataset.w; store.set('week', week); render(); window.scrollTo({top:0}); return; }
  const tb = e.target.closest('[data-t]');
  if (tb){ tab = tb.dataset.t; store.set('tab', tab); render(); return; }
  if (e.target.id === 'toggleRu'){
    const d = $('#dlg'); d.classList.toggle('show-ru');
    e.target.textContent = d.classList.contains('show-ru') ? 'Скрыть перевод' : 'Показать перевод';
  }
  if (e.target.id === 'speak'){
    speechSynthesis.cancel();
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v=>v.lang==='pt-PT') || voices.find(v=>/^pt/.test(v.lang));
    W[week].dialog.forEach(([,pt])=>{ const u = new SpeechSynthesisUtterance(pt); u.lang='pt-PT'; if(v) u.voice=v; u.rate=.95; speechSynthesis.speak(u); });
  }
  if (e.target.id === 'check') checkTest();
  if (e.target.id === 'reset'){ render(); }
});
document.addEventListener('change', (e)=>{
  if (e.target.dataset && e.target.dataset.c){
    const checks = store.get('plan:'+week, {});
    checks[e.target.dataset.c] = e.target.checked;
    store.set('plan:'+week, checks);
    e.target.closest('li').classList.toggle('done', e.target.checked);
  }
});
document.addEventListener('input', (e)=>{
  if (e.target.id === 'feyn'){ store.set('feyn:'+week, e.target.value); }
});

function checkTest(){
  const w = W[week];
  let right = 0;
  const catR = w.progress.map(()=>0), catT = w.progress.map(()=>0);
  w.test.forEach((t,qi)=>{
    const box = document.querySelector(`[data-q="${qi}"]`);
    const sel = box.querySelector('input:checked');
    box.classList.add('checked');
    box.querySelectorAll('label').forEach((l,oi)=>{
      l.classList.remove('right','wrong');
      if (oi===t.a) l.classList.add('right');
      else if (sel && +sel.value===oi) l.classList.add('wrong');
    });
    catT[t.c]++;
    if (sel && +sel.value===t.a){ right++; catR[t.c]++; }
  });
  const pct = Math.round(right / w.test.length * 100);
  const cat = catT.map((n,i)=> n ? Math.round(catR[i]/n*100) : null);
  const prev = store.get('score:'+week, null);
  if (!prev || pct >= prev.pct) store.set('score:'+week, {pct, right, total:w.test.length, cat});
  $('#score').innerHTML = `Результат: ${right}/${w.test.length} — ${pct}% ${pct>=80?'✅ Цель достигнута!':'· цель 80% — повторите разделы и попробуйте ещё раз'}`;
  renderWeeks();
}

/* ---------- theme ---------- */
(function(){
  const saved = store.get('theme', null);
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  $('#themeBtn').addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    store.set('theme', next);
  });
})();

render();
</script>
